name: Build & Deploy iOS (IPA Distribution & App Store Connect)

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Custom iOS Build Number (leave blank to auto-increment from GitHub run number)'
        required: false
        default: ''
      create_release:
        description: 'Create a downloadable GitHub Release'
        required: false
        type: boolean
        default: true

  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'app/**'
      - 'src/**'
      - 'assets/**'
      - 'ios/**'
      - 'package.json'
      - 'app.json'
      - '.github/workflows/deploy-ios.yml'

concurrency:
  group: ios-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build & Distribute iOS IPA
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: 4. Install Node dependencies
        run: npm ci

      - name: 5. Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: 6. Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: 7. Configure iOS Build Number & Marketing Version
        run: |
          BUILD_NUM="${{ github.event.inputs.build_number }}"
          if [ -z "$BUILD_NUM" ]; then
            BUILD_NUM=$(node -p "require('./app.json').expo.ios?.buildNumber || 58")
          fi
          APP_VERSION=$(node -p "require('./app.json').expo.version || '1.0.58'")
          echo "Setting iOS build number to: $BUILD_NUM and marketing version to: $APP_VERSION"
          cd ios
          xcrun agvtool new-version -all "$BUILD_NUM"
          xcrun agvtool new-marketing-version "$APP_VERSION"

      - name: 8. Install Apple Certificates and Provisioning Profiles
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          MAIN_PROVISION_PROFILE_BASE64: ${{ secrets.MAIN_PROVISION_PROFILE_BASE64 }}
          WIDGET_PROVISION_PROFILE_BASE64: ${{ secrets.WIDGET_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temporal-ci-keychain-pass' }}
        run: |
          # 1. Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # 2. Decode and import Distribution Certificate (.p12)
          CERT_PATH=$RUNNER_TEMP/distribution.p12
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERT_PATH
          security import $CERT_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Add keychain to search list
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')

          # 3. Create Provisioning Profiles directory
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"

          # 4. Decode Main App Provisioning Profile
          echo -n "$MAIN_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PROFILES_DIR/main_app.mobileprovision"
          MAIN_UUID=$(security cms -D -i "$PROFILES_DIR/main_app.mobileprovision" | grep -A1 "<key>UUID</key>" | tail -n1 | sed -e 's/.*<string>//' -e 's/<\/string>.*//')
          MAIN_NAME=$(security cms -D -i "$PROFILES_DIR/main_app.mobileprovision" | grep -A1 "<key>Name</key>" | tail -n1 | sed -e 's/.*<string>//' -e 's/<\/string>.*//')
          cp "$PROFILES_DIR/main_app.mobileprovision" "$PROFILES_DIR/${MAIN_UUID}.mobileprovision"
          echo "Main App Profile: $MAIN_NAME ($MAIN_UUID)"

          # 5. Decode Widget Extension Provisioning Profile
          echo -n "$WIDGET_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PROFILES_DIR/widget.mobileprovision"
          WIDGET_UUID=$(security cms -D -i "$PROFILES_DIR/widget.mobileprovision" | grep -A1 "<key>UUID</key>" | tail -n1 | sed -e 's/.*<string>//' -e 's/<\/string>.*//')
          WIDGET_NAME=$(security cms -D -i "$PROFILES_DIR/widget.mobileprovision" | grep -A1 "<key>Name</key>" | tail -n1 | sed -e 's/.*<string>//' -e 's/<\/string>.*//')
          cp "$PROFILES_DIR/widget.mobileprovision" "$PROFILES_DIR/${WIDGET_UUID}.mobileprovision"
          echo "Widget Profile: $WIDGET_NAME ($WIDGET_UUID)"

          # Export variables for subsequent steps
          echo "MAIN_PROFILE_UUID=$MAIN_UUID" >> $GITHUB_ENV
          echo "WIDGET_PROFILE_UUID=$WIDGET_UUID" >> $GITHUB_ENV

      - name: 9. Generate ExportOptions.plist
        run: |
          cat <<EOF > ios/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>destination</key>
              <string>export</string>
              <key>method</key>
              <string>app-store</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>teamID</key>
              <string>GBSNS2SUWV</string>
              <key>uploadSymbols</key>
              <true/>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.splityourtrip.app</key>
                  <string>${MAIN_PROFILE_UUID}</string>
                  <key>com.splityourtrip.app.SplitYourTripWidgets</key>
                  <string>${WIDGET_PROFILE_UUID}</string>
              </dict>
          </dict>
          </plist>
          EOF
          cat ios/ExportOptions.plist

      - name: 10. Generate .env Configuration
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=https://hpjizujbzvwkxvfsoqqd.supabase.co" > .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" >> .env
          echo "EXPO_PUBLIC_GROQ_API_KEY=${{ secrets.EXPO_PUBLIC_GROQ_API_KEY }}" >> .env

      - name: 11. Archive iOS Application
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://hpjizujbzvwkxvfsoqqd.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_GROQ_API_KEY: ${{ secrets.EXPO_PUBLIC_GROQ_API_KEY }}
        run: |
          xcodebuild archive \
            -workspace ios/SplitYourTrip.xcworkspace \
            -scheme SplitYourTrip \
            -configuration Release \
            -archivePath $RUNNER_TEMP/SplitYourTrip.xcarchive \
            -destination "generic/platform=iOS"

      - name: 12. Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/SplitYourTrip.xcarchive \
            -exportPath $RUNNER_TEMP/build \
            -exportOptionsPlist ios/ExportOptions.plist

      - name: 13. Upload IPA to GitHub Artifacts (Direct Download)
        uses: actions/upload-artifact@v4
        with:
          name: SplitYourTrip-iOS-IPA
          path: ${{ runner.temp }}/build/*.ipa
          retention-days: 30

      - name: 14. Publish GitHub Release (Distribution from GitHub)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/build/*.ipa
          name: SplitYourTrip iOS ${{ github.ref_name || format('v1.0.58 (Build {0})', github.event.inputs.build_number || '58') }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.58-ios-{0}', github.event.inputs.build_number || github.run_number) }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 15. Upload IPA to App Store Connect (TestFlight)
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          # 1. Store private key in default search directory for xcrun altool
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

          # 2. Upload IPA
          IPA_PATH=$(find $RUNNER_TEMP/build -name "*.ipa" | head -n 1)
          echo "Found IPA at: $IPA_PATH"

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --show-progress

      - name: 16. Clean up Keychain & Sensitive Files
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
          rm -rf ~/.appstoreconnect 2>/dev/null || true
          rm -rf "$HOME/Library/MobileDevice/Provisioning Profiles" 2>/dev/null || true
